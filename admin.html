<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Koperasi Induk</title><style>body{font:15px Arial;background:#f1f6f3;color:#17241d;margin:0}main{max-width:950px;margin:30px auto;padding:20px}.panel{background:white;padding:22px;border:1px solid #dce6df;border-radius:12px;margin-bottom:18px}h1{color:#075b3d}input,textarea,select{display:block;width:100%;padding:10px;margin:6px 0 14px;border:1px solid #cedbd2;border-radius:6px;box-sizing:border-box}button{padding:10px 14px;border:0;border-radius:6px;background:#075b3d;color:white;cursor:pointer}.hidden{display:none}.item{padding:12px 0;border-top:1px solid #ddd;display:flex;justify-content:space-between;gap:10px}.msg{color:#a33;font-size:13px}</style></head><body><main><p><a href="index.html">← Kembali ke website</a></p><section class="panel" id="login"><h1>Login Administrator</h1><p>Gunakan akun Supabase yang sudah diberi role admin/editor.</p><form id="loginForm"><label>Email</label><input id="email" type="email" required><label>Password</label><input id="password" type="password" required><button>Login</button><p class="msg" id="loginMsg"></p></form></section><section class="hidden" id="app"><div class="panel"><h1>Admin Panel</h1><p id="who"></p><button id="logout">Keluar</button></div><div class="panel"><label>Kelola konten</label><select id="table"><option value="news">Berita</option><option value="products">Produk</option><option value="activities">Kegiatan</option><option value="cooperatives">Koperasi Primer</option></select><button id="refresh">Muat data</button><div id="list"></div></div><div class="panel"><h2 id="formTitle">Tambah konten</h2><form id="editor"><input id="id" type="hidden"><label>Judul / Nama</label><input id="name" required><label>Kategori / Ringkasan</label><input id="category"><label>Deskripsi</label><textarea id="description"></textarea><label>URL gambar</label><input id="image" type="url"><label>URL website (koperasi)</label><input id="website" type="url"><label>Harga (produk)</label><input id="price" type="number" min="0" step=".01"><label>Tanggal</label><input id="date" type="date"><label><input id="published" type="checkbox" checked style="width:auto;display:inline"> Tampilkan di website</label><button>Simpan</button><button type="button" id="cancel">Batal</button><p class="msg" id="formMsg"></p></form></div></section></main>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const db=createClient('https://wdbgzzpyivtiucfqqxiv.supabase.co','sb_publishable_TOQj5w76GosbOggE6EfOpQ_hRH_G3y7');
const $=id=>document.getElementById(id), tables={news:{name:'title',category:'excerpt',description:'body',date:'published_at'},products:{name:'name',category:'unit',description:'description'},activities:{name:'title',description:'description',date:'activity_date'},cooperatives:{name:'name',category:'category',description:'description',website:'website_url'}};
let current='news';const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function check(session){if(!session){$('login').classList.remove('hidden');$('app').classList.add('hidden');return}const {data,error}=await db.from('profiles').select('full_name,role').eq('id',session.user.id).single();if(error||!data||!['admin','editor'].includes(data.role)){await db.auth.signOut();$('loginMsg').textContent='Akun belum diberi role admin/editor. Atur role di tabel profiles.';return}$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=session.user.email+' · '+data.role;await load()}
$('loginForm').onsubmit=async e=>{e.preventDefault();const {error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)$('loginMsg').textContent=error.message;else{const {data}=await db.auth.getSession();await check(data.session)}};
$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};$('table').onchange=()=>{current=$('table').value;reset();load()};$('refresh').onclick=load;
async function load(){current=$('table').value;const {data,error}=await db.from(current).select('*').order('created_at',{ascending:false}).limit(100);if(error){$('list').textContent=error.message;return}$('list').innerHTML=data.length?data.map(r=>'<div class="item"><span><b>'+safe(r[tables[current].name])+'</b><br><small>'+(r.published?'Ditampilkan':'Disembunyikan')+'</small></span><span><button data-edit="'+r.id+'">Edit</button> <button data-del="'+r.id+'">Hapus</button></span></div>').join(''):'<p>Belum ada data.</p>';data.forEach(r=>{const eb=document.querySelector('[data-edit="'+r.id+'"]');if(eb)eb.onclick=()=>edit(r);const dbtn=document.querySelector('[data-del="'+r.id+'"]');if(dbtn)dbtn.onclick=async()=>{if(confirm('Hapus konten ini?')){const {error}=await db.from(current).delete().eq('id',r.id);if(error)alert(error.message);else load()}}})}
function reset(){$('editor').reset();$('id').value='';$('published').checked=true;$('formTitle').textContent='Tambah konten';$('formMsg').textContent=''}
function edit(r){const c=tables[current];$('id').value=r.id;$('name').value=r[c.name]||'';$('category').value=c.category?r[c.category]||'':'';$('description').value=c.description?r[c.description]||'':'';$('image').value=r.image_url||'';$('website').value=r.website_url||'';$('price').value=r.price??'';$('date').value=r[c.date]||'';$('published').checked=!!r.published;$('formTitle').textContent='Edit konten'}
$('cancel').onclick=reset;$('editor').onsubmit=async e=>{e.preventDefault();const c=tables[current],r={[c.name]:$('name').value.trim(),image_url:$('image').value.trim(),published:$('published').checked};if(c.category)r[c.category]=$('category').value.trim();if(c.description)r[c.description]=$('description').value.trim();if(c.date)r[c.date]=$('date').value||new Date().toISOString().slice(0,10);if(current==='products'){r.price=$('price').value?Number($('price').value):null}if(c.website)r[c.website]=$('website').value.trim();const id=$('id').value;const {error}=id?await db.from(current).update(r).eq('id',id):await db.from(current).insert(r);if(error){$('formMsg').textContent=error.message;return}$('formMsg').textContent='Tersimpan';await load();reset()};
const {data}=await db.auth.getSession();await check(data.session);db.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT')check(null)});
</script></body></html>
